<div class="list-container">
<table class="list-table">
  <tr>
    <th>PO#</th>
    <th>Total</th>
    <th>Date Entered</th>
    <th>Customer</th>
    <th>Vendor</th>
    <th>Employee</th>
    <th>EnteredBy</th>
    <th>Description</th>
    <th>Card Type</th>
    <th>Actions</th>
    </tr>
    <tr *ngFor="let po of purchaseOrders">
      <td><a [routerLink]="['/purchase-orders/view', po.rowId]">{{ po.poNumber }}</a></td>
      <td>{{ po.total | currency }}</td>
      <td>{{ po.dateEntered | date:'short' }}</td>
      <td>{{ po.customer }}</td>
      <td>{{ po.vendor }}</td>
      <td>{{ po.employee }}</td>
      <td>{{ po.enteredBy }}</td>
      <td>{{ po.description }}</td>
      <td>{{ po.cardType }}</td>
      <td>
        <button type="button" class="btn btn-edit" [routerLink]="['/purchase-orders/edit', po.rowId]">Edit</button>
        <!--<button type="button" class="btn btn-view" [routerLink]="['/purchase-orders/view', po.rowId]">View</button>-->
        <button type="button" class="btn btn-delete" (click)="onDelete(po.rowId)">Delete</button>
      </td>
    </tr>
</table>
</div>
<button class="add-new-btn" type="button" [routerLink]="['/purchase-orders/new']" >Add New Purchase Order</button>
