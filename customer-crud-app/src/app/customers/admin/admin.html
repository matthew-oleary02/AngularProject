
<div class="admin-container">
  <h1>User Management</h1>

  <!-- Search -->
  <div class="toolbar" style="display:flex;gap:8px;align-items:center;padding-bottom:8px;">
    <input
      type="text"
      placeholder="Search by username, role, or email..."
      [(ngModel)]="filterText"
      (input)="onFilterChange(filterText)"
      class="search-box"
      style="flex:1;padding:8px;border:1px solid var(--border);border-radius:6px;"
    />

    <td><button type="button" class="btn-clear" (click)="clearFilter()">Clear</button></td>
      <td>
        <input
          type="checkbox"
          id="active"
          name="active"
          (change)="onActiveToggle($event.target.checked)"
          [checked]="activeFilter === true"
          style="margin-right:4px;"
        />
        <label for="active">Active</label>
      </td>
    </div>
  <!-- Table -->
  <table class="user-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>
        <th>Active</th>
        <th>Created On</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td>{{ user.id }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
        <td>{{ user.active ? 'Yes' : 'No' }}</td>
        <td>{{ user.createdOn | date:'short' }}</td>
        <td>
          <button class="btn-edit" [routerLink]="['/admin/edit', user.id]">Edit</button>
          <button (click)="onDelete(user.id)" class="btn-delete">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<button class="add-new-btn" type="button" [routerLink]="['/admin/new']">Add New User</button>
