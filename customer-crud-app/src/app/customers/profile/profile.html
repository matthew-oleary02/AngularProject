<div class="profile-container" *ngIf="username; else loading">
  <h1>User Profile</h1>
  <p><strong>Username:</strong> {{ username }}</p>
  <p><strong>Email:</strong> {{ email }}</p>
  <p><strong>First Name:</strong> {{ firstName }}</p>
  <p><strong>Last Name:</strong> {{ lastName }}</p>

  <td>
    <button type="button" class="btn btn-edit" (click)="editProfile()" routerLink="/profile/edit">Edit Profile</button>
    <button type="button" class="btn btn-delete" (click)="logout()">Log Out</button>
  </td>
</div>

<ng-template #loading>
  <p>Loading profile...</p>
</ng-template>
