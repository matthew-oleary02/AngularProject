<div class="login-container">
  <h1>{{ isRegister ? 'Register' : 'Login' }}</h1>

  <form (ngSubmit)="isRegister ? register() : login()">
    <div class="form-group">
      <label>Username</label>
      <input [(ngModel)]="username" name="username" required>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input [(ngModel)]="password" type="password" name="password" required>
    </div>

    <button type="submit" class="login-btn">{{ isRegister ? 'Create Account' : 'Login'}}</button>
  </form>

  <button (click)="isRegister = true" class="register-btn">Register</button>

  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
</div>
