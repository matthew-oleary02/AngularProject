<!-- customer-list.html - Displays list of customers with filter and actions -->


<div class="list-container">
  <h1>Customer List</h1>
  <!-- Toolbar with filter input and clear button -->
  <div class="toolbar" style="display:flex;gap:8px;align-items:center;padding-bottom:8px;">
    <input
      type="text"
      placeholder="Search name, city, state, email, contact..."
      (input)="onFilterChange($event.target.value)"
      [value]="filterText"
      class="search-box"
      style="flex:1;padding:8px;border:1px solid var(--border);border-radius:6px;"
    />
    <td><button type="button" class="btn-clear" (click)="clearFilter()">Clear</button></td>
    <td>
      <input
        type="checkbox"
        id="active"
        name="active"
        (change)="onActiveToggle($event.target.checked)"
        [checked]="activeFilter === true"
      />
      <label for="active">Active</label>
    </td>
  </div>
<table class="list-table">
  <tr>
    <th>Name</th>
    <th>Email</th>
    <th>Address 1</th>
    <th>Address 2</th>
    <th>City</th>
    <th>State</th>
    <th>Active</th>
    <th>Actions</th>
  </tr>
  <tr *ngFor="let c of customers">
    <td><a [routerLink]="['/customers/view', c.rowId]">{{ c.customerName }}</a></td>
    <td>{{ c.primaryContact.email }}</td>
    <td>{{ c.billingAddress.address1 }}</td>
    <td>{{ c.billingAddress.address2 }}</td>
    <td>{{ c.billingAddress.city }} </td>
    <td>{{ c.billingAddress.state }}</td>
    <td>{{ c.active ? 'Yes' : 'No' }}</td>
    <td>
      <button type="button" class="btn btn-edit" [routerLink]="['/customers/edit', c.rowId]">Edit</button>
      <!--<button type="button" class="btn btn-view" [routerLink]="['/customers/view', c.rowId]">View</button>-->
      <button type="button" class="btn btn-delete" (click)="onDelete(c.rowId)">Delete</button>
    </td>
  </tr>
</table>
</div>
<button class="add-new-btn" type="button" [routerLink]="['/customers/new']" >Add New Customer</button>
