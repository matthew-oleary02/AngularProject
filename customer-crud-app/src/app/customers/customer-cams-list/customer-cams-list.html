<div class="list-container">
  <h1>CAMs</h1>
  
  <div class="toolbar" style="display:flex;gap:8px;align-items:center;padding-bottom:8px;">
    <input
      type="text"
      placeholder="Search here..."
      (input)="onFilterChange($event.target.value)"
      [value]="filterText"
      class="search-box"
      style="flex:1;padding:8px;border:1px solid var(--border);border-radius:6px;"
    />
    <td><button type="button" class="btn-clear" (click)="clearFilter()">Clear</button></td>
    <td>
      <input
        type="checkbox"
        id="active"
        name="active"
        (change)="onActiveToggle($event.target.checked)"
        [checked]="activeFilter === true"
      />
      <label for="active">Active</label>
    </td>
  </div>
<table class="list-table">
  <tr>
    <th>Customer</th>
    <th>User</th>
    <th>Email</th>
    <th>Phone</th>
    <th>Trade</th>
    <th>Actions</th>
  </tr>
  <tr *ngFor="let cc of customerCams">
    <td>{{ cc.customer }}</td>
    <td><a [routerLink] ="['/customer-cams/view', cc.rowId]">{{ cc.username }}</a></td>
    <td>{{ cc.email }}</td>
    <td>{{ cc.phone }}</td>
    <td>{{ cc.trade }}</td>
    <td>
      <button type="button" class="btn btn-edit" [routerLink]="['/customer-cams/edit', cc.rowId]">Edit</button>
      <button type="button" class="btn btn-delete" (click)="onDelete(cc.rowId)">Delete</button>
    </td>
  </tr>
</table>
</div>
<button type="button" class="add-new-btn" [routerLink]="['/customer-cams/new']">Add New CAM</button>
