
<header class="app-header">
  <h1 routerLink="/home">Customer CRUD App</h1>
  <nav>
    <a *ngIf="isLoggedIn() && isManager() || isAdmin()" routerLink="/purchase-orders">Accounting</a>
    <a *ngIf="isLoggedIn()" routerLink="/customers">Customers</a>
    <a *ngIf="isLoggedIn() && isManager() || isAdmin()" routerLink="/vendors">Vendors</a>
    <a *ngIf="isLoggedIn()" routerLink="/offices">Resources</a>

    <!-- Admin dropdown -->
    <div class="nav-dropdown" *ngIf="isLoggedIn() && isAdmin()">
      <a
        class="dropdown-trigger"
        (click)="$event.stopPropagation(); toggleAdminMenu()"
        style="cursor:pointer;"
      >
        Admin
        <span class="chevron" [class.open]="showAdminMenu">▾</span>
      </a>

      <div class="dropdown-menu" *ngIf="showAdminMenu">
        <!-- Use Angular routes or swap to /admin.html and /roles.html if needed -->
        <a routerLink="/admin" (click)="closeAdminMenu()">User Management</a>
        <a routerLink="/roles" (click)="closeAdminMenu()">Role Assignment</a>
      </div>
    </div>

    <a *ngIf="isLoggedIn()" routerLink="/profile">Profile</a>
    <a (click)="handleAuth()" style="cursor:pointer;">
      {{ isLoggedIn() ? 'Log Off' : 'Login' }}
    </a>
  </nav>
</header>
