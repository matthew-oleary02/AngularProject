<h1>{{ isEdit ? 'Edit Resource' : 'Add New Resource' }}</h1>

<div class="card">
  <form [formGroup]="form" (ngSubmit)="submit()">

    <label for="fname" class="full-label">first name:</label>
    <input id="fname" class="full-input" formControlName="fname" type="text" />
    <!-- Validation message for resource name -->
    <div class="error" *ngIf="form.get('fname')?.invalid && form.get('fname')?.touched">
      Required
    </div>

    <label for="lname" class="full-label">last name:</label>
    <input id="lname" class="full-input" formControlName="lname" type="text" />
    <!-- Validation message for resource name -->
    <div class="error" *ngIf="form.get('lname')?.invalid && form.get('lname')?.touched">
      Required
    </div>

    <fieldset formGroupName="contactInfo" class="fieldset-grid">
      <legend>Contact Info</legend>
      
      <label for="title">title:</label>
      <input id="title" formControlName="title" type="text" />

      <label for="department">department:</label>
      <input id="department" formControlName="department" type="text" />

      <label for="phone">phone:</label>
      <input id="phone" formControlName="phone" type="text" />

      <label for="cellphone">cellphone:</label>
      <input id="cellphone" formControlName="cellphone" type="text" />

      <label for="email">email:</label>
      <input id="email" formControlName="email" type="text" />

      <label for="address1">Address 1:</label>
      <input id="address1" formControlName="address1" type="text" />

      <label for="address2">Address 2:</label>
      <input id="address2" formControlName="address2" type="text" />

      <label for="city">City:</label>
      <input id="city" formControlName="city" type="text" />

      <label for="state">State:</label>
      <input id="state" formControlName="state" type="text" />

      <label for="zipCode">Zip:</label>
      <input id="zipCode" formControlName="zipCode" type="text" />

      <label for="hireDate">hireDate:</label>
      <input id="hireDate" formControlName="hireDate" type="date" />

      <label for="leadTech">Lead Tech:</label>
      <input id="leadTech" type="checkbox" formControlName="leadTech" />

      <label for="active">Active:</label>
      <input id="active" type="checkbox" formControlName="active" />
    </fieldset>

    <fieldset class="fieldset-grid additional-info">
      <legend>Additional Information</legend>

      <label for="company">Company:</label>
      <input id="company" formControlName="company" type="text" />

      <label for="employmentType">employmentType:</label>
      <input id="employmentType" formControlName="employmentType" type="text" />

      <label for="pin">pin:</label>
      <input id="pin" formControlName="pin" type="text" />

      <label for="dob">dob:</label>
      <input id="dob" formControlName="dob" type="date" />

      <label for="groupName">groupName:</label>
      <input id="groupName" formControlName="groupName" type="text" />
    </fieldset>

<div class="form-actions">
  <td><button type="submit" [disabled]="form.invalid">{{ 'Save' }}</button></td>
  <td><button type="button" class="btn-cancel" [routerLink]="['/resources']">Cancel</button></td>
</div>
  </form>
</div>
