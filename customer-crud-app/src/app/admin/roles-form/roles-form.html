<!-- roles-form.html -->

<div class="role-form-container">
  <h1>{{ isEdit ? 'Edit Role' : 'Add New Role' }}</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div>
      <label for="roleName">Role Name:</label>
      <input id="roleName" type="text" formControlName="roleName" required>
    </div>
    <div>
      <label for="roleDescription">Description:</label>
      <textarea id="roleDescription" formControlName="roleDescription"></textarea>
    </div>
    <button type="submit" [disabled]="form.invalid">{{ isEdit ? 'Update' : 'Add' }} Role</button>
    <button type="button" [routerLink]="['/roles']">Cancel</button>
  </form>
</div>
