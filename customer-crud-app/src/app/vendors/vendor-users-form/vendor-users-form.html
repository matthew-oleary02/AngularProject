<h1>{{ isEdit ? 'Edit Vendor User' : 'Add New Vendor User' }}</h1>

<div class="card">
  <form [formGroup]="form" (ngSubmit)="submit()">

    <label for="vendor" class="full-label">Vendor:</label>
    <select id="vendor" class="full-input" formControlName="vendor">
      <option value="">Select a vendor</option>
      <option *ngFor="let v of vendors" [value]="v.vendorName">
      {{ v.vendorName }}
      </option>
    </select>

    <div class="error" *ngIf="form.get('vendor')?.invalid && form.get('vendor')?.touched">
      Required
    </div>

    <label for="username" class="full-label">Username:</label>
    <input id="username" class="full-input" formControlName="username" type="text" />

    <div class="error" *ngIf="form.get('username')?.invalid && form.get('username')?.touched">
      Required
    </div>

    <label for="email" class="full-label">Email:</label>
    <input id="email" class="full-input" formControlName="email" type="email" />

    <div class="error" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
      Valid email required
    </div>

    <label for="phone" class="full-label">Phone:</label>
    <input id="phone" class="full-input" formControlName="phone" type="text" />

    <div class="error" *ngIf="form.get('phone')?.invalid && form.get('phone')?.touched">
      Required
    </div>

    <label for="trade" class="full-label">Trade:</label>
    <input id="trade" class="full-input" formControlName="trade" type="text" />

    <div class="error" *ngIf="form.get('trade')?.invalid && form.get('trade')?.touched">
      Required
    </div>

    <label for="active" class="full-label">
      <input id="active" type="checkbox" formControlName="active" />
      Active
    </label>

    <div class="form-actions">
      <button type="submit" [disabled]="form.invalid">{{ isEdit ? 'Update' : 'Create' }}</button>
      <button type="button" class="btn-cancel" [routerLink]="['/vendors']">Cancel</button>
    </div>
  </form>
</div>

<ng-template #notFound>
  <div class="card">
    <p>Vendor User not found.</p>
    <button type="button" class="btn-cancel" [routerLink]="['/vendors']">Back</button>
  </div>
</ng-template>
