<h1>Vendor Contract Status</h1>

<div class="toolbar" style="display:flex;gap:8px;align-items:center;padding-bottom:8px;">
  <input
    type="text"
    placeholder="Search status..."
    (input)="onFilterChange($any($event.target).value)"
    [value]="filterText"
    class="search-box"
    style="flex:1;padding:8px;border:1px solid var(--border);border-radius:6px;"
  />
  <button type="button" class="btn-return" (click)="clearFilter()">Clear</button>
  <button type="button" class="btn-create" [routerLink]="['/vendor-contract-status/new']">Add New Status</button>
</div>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Status</th>
      <th>Created On</th>
      <th>Created By</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let s of statuses">
      <td>{{ s.rowId }}</td>
      <td>{{ s.status }}</td>
      <td>{{ s.createdOn | date:'short' }}</td>
      <td>{{ s.createdBy }}</td>
      <td>
        <button type="button" class="btn btn-view" [routerLink]="['/vendor-contract-status/view', s.rowId]">View</button>
        <button type="button" class="btn btn-edit" [routerLink]="['/vendor-contract-status/edit', s.rowId]">Edit</button>
        <button type="button" class="btn btn-delete" (click)="onDelete(s.rowId)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>
