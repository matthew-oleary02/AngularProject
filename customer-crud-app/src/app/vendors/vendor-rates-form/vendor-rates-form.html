<!-- customer-crud-app/src/app/vendors/vendor-rates-form/vendor-rates-form.html -->
<h1>{{ isEdit ? 'Edit Vendor Rate' : 'Add New Vendor Rate' }}</h1>

<div class="card">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">

    <label for="vendor" class="full-label">Vendor:</label>
    <select id="vendor" class="full-input" formControlName="vendorName">
      <option value="">Select a vendor</option>
      <!-- TODO: Replace vendorName with the actual property name from Vendor model -->
      <option *ngFor="let vend of vendors" [value]="vend.vendorName">
      {{ vend.vendorName }}
      </option>
    </select>

    <div class="error" *ngIf="form.get('vendorName')?.invalid && form.get('vendorName')?.touched">
      Required
    </div>

    <label for="trade" class="full-label">Trade:</label>
    <input id="trade" class="full-input" formControlName="trade" type="text" />

    <div class="error" *ngIf="form.get('trade')?.invalid && form.get('trade')?.touched">
      Required
    </div>

    <label for="rateType" class="full-label">Rate Type:</label>
    <input id="rateType" class="full-input" formControlName="rateType" type="text" />

    <div class="error" *ngIf="form.get('rateType')?.invalid && form.get('rateType')?.touched">
      Required
    </div>

    <label for="state" class="full-label">State:</label>
    <input id="state" class="full-input" formControlName="state" type="text" />

    <div class="error" *ngIf="form.get('state')?.invalid && form.get('state')?.touched">
      Required
    </div>

    <label for="rate" class="full-label">Rate:</label>
    <input id="rate" class="full-input" formControlName="rate" type="number" />

    <div class="error" *ngIf="form.get('rate')?.invalid && form.get('rate')?.touched">
      Required and must be a positive number
    </div>

    <div class="form-actions">
      <td><button type="submit" [disabled]="form.invalid">{{ isEdit ? 'Update' : 'Create' }}</button></td>
      <td><button type="button" class="btn-cancel" [routerLink]="['/vendors']">Cancel</button></td>
    </div>
    </form>
</div>
