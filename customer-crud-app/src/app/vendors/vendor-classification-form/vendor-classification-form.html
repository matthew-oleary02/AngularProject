<h1>{{ isEdit ? 'Edit' : 'Add' }} Vendor Classification</h1>

<div class="card">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-grid">

      <!-- Vendor Selection -->
      <div class="field">
        <label for="vendorId">Vendor</label>
        <select id="vendorId" formControlName="vendorId">
          <option value="">-- Select Vendor --</option>
          <option *ngFor="let v of vendors" [value]="v.rowId">
            {{ v.vendorName }} (ID: {{ v.rowId }})
          </option>
        </select>
        <div *ngIf="form.get('vendorId')?.touched && form.get('vendorId')?.invalid" class="error">
          Vendor is required.
        </div>
      </div>

      <!-- Classification -->
      <div class="field">
        <label for="classification">Classification</label>
        <input id="classification" type="text" formControlName="classification"
          placeholder="Enter classification (e.g. HVAC, Plumbing)">
        <div *ngIf="form.get('classification')?.touched && form.get('classification')?.invalid" class="error">
          Classification is required.
        </div>
      </div>

    </div>

    <div class="actions">
      <button type="button" class="btn-cancel" [routerLink]="['/vendors']">Cancel</button>
      <button type="submit" class="btn-create" [disabled]="form.invalid">
        {{ isEdit ? 'Update' : 'Save' }}
      </button>
    </div>
  </form>
</div>
