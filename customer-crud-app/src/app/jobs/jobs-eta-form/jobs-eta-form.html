<h1>{{ isEdit ? 'Edit Job ETA' : 'Add New Job ETA' }}</h1>

<div class="card">
  <form [formGroup]="form" (ngSubmit)="submit()">

    <label for="job" class="full-label">Job Number:</label>
    <select id="job" class="full-input" formControlName="job">
      <option value="">Select a job</option>
      <option *ngFor="let j of jobsList" [value]="j.jobNumber">
      {{ j.jobNumber }} - {{ j.customer }}
      </option>
    </select>

    <div class="error" *ngIf="form.get('job')?.invalid && form.get('job')?.touched">
      Required
    </div>

    <label for="serviceType" class="full-label">Service Type:</label>
    <input id="serviceType" type="text" class="full-input" formControlName="serviceType" />

    <div class="error" *ngIf="form.get('serviceType')?.invalid && form.get('serviceType')?.touched">
      Required
    </div>

    <label for="etaHours" class="full-label">ETA Hours:</label>
    <input id="etaHours" type="number" class="full-input" formControlName="etaHours" />

    <div class="error" *ngIf="form.get('etaHours')?.invalid && form.get('etaHours')?.touched">
      Required and must be a non-negative number
    </div>
    
    <label for="hoursBusDays" class="full-label">Hours Bus Days:</label>
    <input id="hoursBusDays" type="number" class="full-input" formControlName="hoursBusDays" />

    <div class="error" *ngIf="form.get('hoursBusDays')?.invalid && form.get('hoursBusDays')?.touched">
      Required and must be a non-negative number
    </div>

    <div class="form-actions">
      <td><button type="submit" [disabled]="form.invalid">{{ isEdit ? 'Update' : 'Create' }}</button></td>
      <td><button type="button" class="btn-cancel" [routerLink]="['/jobs']">Cancel</button></td>
    </div>
    </form>
</div>
